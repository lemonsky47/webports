<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>

<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Cruelty Squad</title>
	<style type='text/css'>
		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
		}

		#status-indeterminate>div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate>div:nth-child(1) {
			transform: rotate(22.5deg);
		}

		#status-indeterminate>div:nth-child(2) {
			transform: rotate(67.5deg);
		}

		#status-indeterminate>div:nth-child(3) {
			transform: rotate(112.5deg);
		}

		#status-indeterminate>div:nth-child(4) {
			transform: rotate(157.5deg);
		}

		#status-indeterminate>div:nth-child(5) {
			transform: rotate(202.5deg);
		}

		#status-indeterminate>div:nth-child(6) {
			transform: rotate(247.5deg);
		}

		#status-indeterminate>div:nth-child(7) {
			transform: rotate(292.5deg);
		}

		#status-indeterminate>div:nth-child(8) {
			transform: rotate(337.5deg);
		}

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}
	</style>
	<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
	<link rel='apple-touch-icon' href='index.apple-touch-icon.png' />

</head>

<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div id='status-progress-inner'></div>
		</div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		// Auto-unpacking logic for split index.pck
		const ChunkUnpacker = {
			DB_NAME: 'GodotGameDB',
			STORE_NAME: 'files',
			PCK_FILE: 'index.pck',

			async initDB() {
				return new Promise((resolve, reject) => {
					const request = indexedDB.open(this.DB_NAME, 1);
					request.onerror = () => reject(request.error);
					request.onsuccess = () => resolve(request.result);
					request.onupgradeneeded = (event) => {
						const db = event.target.result;
						if (!db.objectStoreNames.contains(this.STORE_NAME)) {
							db.createObjectStore(this.STORE_NAME);
						}
					};
				});
			},

			async getStoredFile(db, filename) {
				return new Promise((resolve, reject) => {
					const transaction = db.transaction([this.STORE_NAME], 'readonly');
					const store = transaction.objectStore(this.STORE_NAME);
					const request = store.get(filename);
					request.onerror = () => reject(request.error);
					request.onsuccess = () => resolve(request.result);
				});
			},

			async storeFile(db, filename, data) {
				return new Promise((resolve, reject) => {
					const transaction = db.transaction([this.STORE_NAME], 'readwrite');
					const store = transaction.objectStore(this.STORE_NAME);
					const request = store.put(data, filename);
					request.onerror = () => reject(request.error);
					request.onsuccess = () => resolve();
				});
			},

			async fetchChunks(progressCallback) {
				const chunks = [];
				let chunkNames = null;

				try {
					const manifestRes = await fetch('chunks_manifest.json');
					if (manifestRes.ok) {
						const manifest = await manifestRes.json();
						chunkNames = (manifest.chunks || []).map(c => c.name);
					}
				} catch (e) { /* no manifest, use probe */ }

				if (!chunkNames || chunkNames.length === 0) {
					let partNum = 0;
					while (true) {
						const partName = `index.pck.gz.part${String(partNum).padStart(3, '0')}`;
						try {
							progressCallback(`Downloading ${partName}...`);
							const response = await fetch(partName);
							if (!response.ok) {
								if (partNum === 0) throw new Error('No chunk files found');
								break;
							}
							chunks.push(await response.arrayBuffer());
							partNum++;
						} catch (e) {
							if (partNum === 0) throw e;
							break;
						}
					}
				} else {
					for (let i = 0; i < chunkNames.length; i++) {
						progressCallback(`Downloading ${chunkNames[i]}... (${i + 1}/${chunkNames.length})`);
						const response = await fetch(chunkNames[i]);
						if (!response.ok) throw new Error(`Failed to load ${chunkNames[i]}`);
						chunks.push(await response.arrayBuffer());
					}
				}

				return chunks;
			},

			async reassembleAndDecompress(chunks, progressCallback) {
				progressCallback('Reassembling chunks...');

				// Combine all chunks
				const totalSize = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
				const combined = new Uint8Array(totalSize);
				let offset = 0;
				for (const chunk of chunks) {
					combined.set(new Uint8Array(chunk), offset);
					offset += chunk.byteLength;
				}

				progressCallback('Decompressing...');

				// Decompress using DecompressionStream
				const blob = new Blob([combined]);
				const stream = blob.stream();
				const decompressedStream = stream.pipeThrough(new DecompressionStream('gzip'));
				const decompressedBlob = await new Response(decompressedStream).blob();
				const decompressed = await decompressedBlob.arrayBuffer();

				return decompressed;
			},

			async checkAndUnpack(progressCallback) {
				// Check if index.pck is accessible via fetch
				try {
					const response = await fetch(this.PCK_FILE, { method: 'HEAD' });
					if (response.ok) {
						progressCallback('index.pck found, no unpacking needed');
						return null; // File exists, no unpacking needed
					}
				} catch (e) {
					// File doesn't exist, proceed with unpacking
				}

				// Check IndexedDB for cached file
				const db = await this.initDB();
				const stored = await this.getStoredFile(db, this.PCK_FILE);

				if (stored) {
					progressCallback('Using cached index.pck from IndexedDB');
					return stored;
				}

				// Fetch, reassemble, and decompress
				progressCallback('Fetching chunk files...');
				const chunks = await this.fetchChunks(progressCallback);
				const decompressed = await this.reassembleAndDecompress(chunks, progressCallback);

				// Store in IndexedDB for future use
				progressCallback('Caching to IndexedDB...');
				await this.storeFile(db, this.PCK_FILE, decompressed);

				progressCallback('Unpacking complete!');
				return decompressed;
			}
		};

		const GODOT_CONFIG = { "args": [], "canvasResizePolicy": 2, "executable": "index", "experimentalVK": false, "fileSizes": { "index.pck": 534748816, "index.wasm": 13793958 }, "focusCanvas": true, "gdnativeLibs": [] };
		var engine = new Engine(GODOT_CONFIG);

		(function () {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusEl = document.getElementById('status');
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				statusEl.style.visibility = (mode === 'hidden') ? 'hidden' : 'visible';
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function (value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');

				// Check and unpack chunks before starting game
				let unpackedPckData = null;

				ChunkUnpacker.checkAndUnpack((msg) => {
					setStatusNotice(msg);
					setStatusMode('notice');
				}).then((data) => {
					unpackedPckData = data;
					
					// If we have unpacked data, override fetch to intercept requests for index.pck
					if (unpackedPckData) {
						const originalFetch = window.fetch;
						window.fetch = function(resource, init) {
							const url = typeof resource === 'string' ? resource : (resource && resource.url);
							const path = url ? url.split('?')[0] : '';
							const isPck = path === 'index.pck' || path.endsWith('/index.pck');
							if (url && isPck) {
								console.log('Intercepting fetch for index.pck, serving unpacked data');
								return Promise.resolve(new Response(unpackedPckData, {
									status: 200,
									statusText: 'OK',
									headers: { 'Content-Type': 'application/octet-stream' }
								}));
							}
							return originalFetch.apply(this, arguments);
						};
					}
					
					// Start the engine with progress tracking
					const engineOptions = {
						'onProgress': function (current, total) {
							if (total > 0) {
								statusProgressInner.style.width = current / total * 100 + '%';
								setStatusMode('progress');
								if (current === total) {
									// wait for progress bar animation
									setTimeout(() => {
										setStatusMode('indeterminate');
									}, 500);
								}
							} else {
								setStatusMode('indeterminate');
							}
						}
					};
					
					return engine.startGame(engineOptions);
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
		//]]></script>
</body>

</html>
